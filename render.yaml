databases:
  - name: studybuddy-db
    databaseName: studybuddy
    user: studybuddy

services:
  - type: web
    name: studybuddy-backend
    env: python
    region: ohio
    buildCommand: "cd backend && chmod +x build.sh && ./build.sh"
    startCommand: "cd backend && gunicorn studybuddy.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: studybuddy-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "studybuddy-backend.onrender.com"
      - key: GROQ_API_KEY
        sync: false
