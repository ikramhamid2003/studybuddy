version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR a week for every minor/patch bump; majors still arrive alone so
      # each gets its own review.
      backend-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # CI never boots gunicorn, so a major bump needs a manual deploy test.
      - dependency-name: gunicorn
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # React majors must move react, react-dom and the libraries around them
      # together; do that as a deliberate migration, not a single-package bump.
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      # Tailwind 4 replaces the PostCSS plugin and config format.
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
