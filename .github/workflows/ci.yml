name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run Ruff Linter
        run: |
          ruff check backend/

      - name: Check for Unmigrated Model Changes
        env:
          GROQ_API_KEY: "fake_key"
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          cd backend
          # The same gate backend/build.sh runs before a deploy migrates: a model
          # change with no migration file must fail here, not ship.
          python manage.py makemigrations --check --dry-run

      - name: Run Tests
        env:
          GROQ_API_KEY: "fake_key"
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          cd backend
          python -m pytest

  # The pgvector branch of retrieve_chunks() only exists on Postgres and falls
  # back to numpy silently, so the raw vector SQL never executes under SQLite.
  # This job gives it one real database to run against. Kept separate because the
  # rest of the suite is deliberately SQLite-only and needs no service.
  rag-pgvector:
    name: RAG pgvector SQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: studybuddy
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Enable pgvector
        run: |
          # template1, so the test database pytest-django creates inherits the
          # extension. Deliberately not a migration: a deployment whose database
          # user cannot create extensions must still be able to fall back.
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d template1 \
            -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS vector;'

      - name: Run pgvector retrieval tests
        env:
          GROQ_API_KEY: "fake_key"
          TEST_DATABASE_URL: "postgres://postgres:postgres@127.0.0.1:5432/studybuddy"
        run: |
          cd backend
          python -m pytest study_api/tests/test_rag.py -k pgvector -q

  frontend:
    name: Frontend Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Matches frontend/package.json engines.node. Testing a different runtime
          # than the one the app claims to need proves nothing about a deploy.
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          # No `|| npm install` fallback: a lockfile that disagrees with
          # package.json has to fail the build, not silently resolve something else.
          npm ci --legacy-peer-deps

      - name: Run ESLint Check
        run: |
          cd frontend
          npm run lint

      - name: Run Frontend Tests
        env:
          CI: true
        run: |
          cd frontend
          npm test -- --watchAll=false
